<svg xmlns="http://www.w3.org/2000/svg" width="200" height="262" viewBox="0 0 200 262" class="fig fig-hand" role="img" aria-label="Mano derecha, palma"><style>
  :root{--sil:#E1E8F0;--linea:#1F2F4A;--fondo:#FFFFFF;--tenue:#5E6E86;--tinta:#15233C;--zona:#0E7C7B;
        --z1:#0E7C7B;--z2:#C8783E;--z3:#3B5BA9;--z4:#8E4FA6;--mal:#CF3F2E}
  @media (prefers-color-scheme: dark){
    :root{--sil:#243149;--linea:#9FB0C9;--fondo:#182235;--tinta:#E7EDF6;--tenue:#97A6BD;--zona:#3DB7B1;
          --z1:#3DB7B1;--z2:#E39A5F;--z3:#7C9BE6;--z4:#B783CC;--mal:#F07563}
  }
  .fondo{fill:var(--fondo)}
  .sil-out path,.sil-out ellipse{fill:none;stroke:var(--linea);stroke-width:3;stroke-linejoin:round}
  .sil path,.sil ellipse{fill:var(--sil)}
  .seg path{stroke:var(--fondo);stroke-width:.9}
  .zone{fill:var(--zona)!important}
  .z1{fill:var(--z1)!important}.z2{fill:var(--z2)!important}.z3{fill:var(--z3)!important}.z4{fill:var(--z4)!important}
  .hide{fill:transparent!important;stroke:none!important}
  rect.zone{opacity:.88}
  .lm path,.lm ellipse,.lm rect,.lm circle{fill:none;stroke:var(--tenue);stroke-width:1;opacity:.8}
  .lm .lmdot{fill:var(--tenue)}
  .kp{fill:var(--linea)}
  .kplabel{font:700 8.5px system-ui,sans-serif;fill:var(--tinta);paint-order:stroke;stroke:var(--fondo);stroke-width:2.5px}
  .kp-on{fill:var(--mal);stroke:#fff;stroke-width:1.5}
  .kp-halo{fill:var(--mal);opacity:.22}
  .caption,.side{font:500 9px system-ui,sans-serif;fill:var(--tenue)}
  .pl-a,.pl-b,.pl-c,.pl-lat,.pl-post,.pl-med,.pl-side{fill:none;stroke-width:2.6}
  .pl-lat{stroke:var(--z1)}.pl-post{stroke:var(--z3)}.pl-med{stroke:var(--z2)}
  .pl-a,.pl-b,.pl-c{stroke:var(--tenue)}
  .pl-side{stroke:var(--tenue);stroke-width:1.2;stroke-dasharray:3 2}
  .pl-node{fill:var(--tinta)}
  .pl-lab{font:600 10.5px system-ui,sans-serif;fill:var(--tinta)}
  .pl-br{font-weight:700}.pl-sub{fill:var(--tenue);font-weight:500}
  .pl-small{font:500 8.5px system-ui,sans-serif;fill:var(--tenue)}
  .pl-col{font:600 9px system-ui,sans-serif;fill:var(--tenue)}
  .grid{stroke:var(--sil)}
  .bar-l{fill:var(--z1)}.bar-s{fill:var(--z3)}
</style><rect class="fondo" x="0" y="0" width="200" height="262"/>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F4F7">
<meta name="description" content="Estudio offline de inervación muscular, dermatomas y EMG con repetición espaciada.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Raíz y nervio">
<title>Raíz y nervio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root {
  --paper: #F1F4F7;
  --surface: #FFFFFF;
  --ink: #15233C;
  --muted: #5E6E86;
  --line: #D9E1EA;
  --soft: #E6ECF2;
  --accent: #0E7C7B;
  --accent-ink: #FFFFFF;
  --accent-soft: #D7EEEC;
  --blue: #3B5BA9;
  --ok: #23875A;
  --ok-soft: #DCF1E6;
  --warn: #C4921A;
  --bad: #CF3F2E;
  --bad-soft: #FBE3DF;
  --sil: #E1E8F0;
  --sil-line: #1F2F4A;
  --z1: #0E7C7B; --z2: #C8783E; --z3: #3B5BA9; --z4: #8E4FA6;
  --radius-l: 18px; --radius-m: 12px; --radius-s: 8px;
  --f-display: ui-rounded, "SF Pro Rounded", "Nunito", "Avenir Next", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101827; --surface: #182235; --ink: #E7EDF6; --muted: #97A6BD; --line: #2A3852; --soft: #1F2B41;
    --accent: #3DB7B1; --accent-ink: #062322; --accent-soft: #173B3D; --blue: #7C9BE6;
    --ok: #4CC08A; --ok-soft: #173A2C; --warn: #E0B24A; --bad: #F07563; --bad-soft: #432422;
    --sil: #243149; --sil-line: #9FB0C9; --z1: #3DB7B1; --z2: #E39A5F; --z3: #7C9BE6; --z4: #B783CC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101827; --surface: #182235; --ink: #E7EDF6; --muted: #97A6BD; --line: #2A3852; --soft: #1F2B41;
  --accent: #3DB7B1; --accent-ink: #062322; --accent-soft: #173B3D; --blue: #7C9BE6;
  --ok: #4CC08A; --ok-soft: #173A2C; --warn: #E0B24A; --bad: #F07563; --bad-soft: #432422;
  --sil: #243149; --sil-line: #9FB0C9; --z1: #3DB7B1; --z2: #E39A5F; --z3: #7C9BE6; --z4: #B783CC;
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 16px/1.5 var(--f-body); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.page { max-width: 560px; margin: 0 auto; padding: 18px 18px calc(96px + env(safe-area-inset-bottom, 0px)); }
.page.session, .page.summary { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
.page-title { font: 700 1.75rem/1.2 var(--f-display); margin: 8px 0 18px; letter-spacing: -0.01em; }
.sec-title { font: 650 1rem/1.3 var(--f-display); margin: 0 0 12px; }
.note { color: var(--muted); font-size: .9rem; margin: 10px 0 0; }

/* ---------- botones ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid transparent;
  font-weight: 650; font-size: 1rem; transition: transform .1s ease, background .15s ease;
}
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-ink); width: 100%; }
.btn.primary:disabled { opacity: .4; }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.file { position: relative; overflow: hidden; }
.btn.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--soft);
  display: grid; place-items: center; font-size: 1.3rem; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }

/* ---------- barra inferior ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center; gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1; max-width: 130px; border: 0; background: none; padding: 6px 0 4px; border-radius: 12px;
  display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .72rem; font-weight: 600;
}
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
.tab.on { color: var(--accent); }

/* ---------- inicio ---------- */
.home-head { margin: 6px 0 14px; }
.date { margin: 0; color: var(--muted); font-size: .9rem; }
.date::first-letter { text-transform: uppercase; }
.brand { font: 750 1.6rem/1.15 var(--f-display); margin: 2px 0 0; letter-spacing: -0.01em; }
.today {
  background: var(--surface); border-radius: var(--radius-l); padding: 22px 20px 20px;
  border: 1px solid var(--line);
}
.today-count { display: flex; align-items: baseline; gap: 10px; }
.today-count .big { font: 800 4rem/1 var(--f-display); letter-spacing: -0.03em; color: var(--accent); font-variant-numeric: tabular-nums; }
.today-count .big.done { color: var(--muted); }
.today-count .lbl { font-weight: 600; color: var(--ink); }
.today-split { margin: 6px 0 18px; color: var(--muted); }
.big-btn { min-height: 54px; font-size: 1.05rem; }

/* mapa segmentario: la pieza protagonista */
.segmap { margin: 22px 0 0; padding: 18px 16px 14px; background: var(--surface); border-radius: var(--radius-l); border: 1px solid var(--line); }
.seg-row { display: grid; grid-template-columns: 66px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
.seg-name { font-size: .78rem; color: var(--muted); font-weight: 600; }
.seg-cells { display: flex; gap: 4px; }
.seg {
  flex: 1; min-width: 0; height: 38px; border-radius: 7px; border: 1.5px solid var(--line); background: var(--soft);
  font: 700 .72rem/1 var(--f-display); color: var(--muted); padding: 0; font-variant-numeric: tabular-nums;
}
.seg-cells.dense .seg { height: 32px; font-size: .68rem; border-radius: 5px; }
.seg-cells.dense { gap: 3px; }
.seg.g { background: var(--ok); border-color: var(--ok); color: #fff; }
.seg.y { background: var(--warn); border-color: var(--warn); color: #fff; }
.seg.r { background: var(--bad); border-color: var(--bad); color: #fff; }
.seg.u { background: transparent; }
.seg.sel { outline: 2.5px solid var(--ink); outline-offset: 1.5px; }
.seg-info { margin: 12px 0 6px; font-size: .9rem; min-height: 1.4em; }
.seg-legend { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: .75rem; color: var(--muted); }
.seg-legend i, .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-left: 6px; }
.seg-legend i:first-child { margin-left: 0; }
.seg-legend .g { background: var(--ok); } .seg-legend .y { background: var(--warn); } .seg-legend .r { background: var(--bad); }
.seg-legend .u { border: 1.5px solid var(--line); }

.mini-stats, .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.mini-stats > div, .kpis > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-m); padding: 12px; }
.mini-stats .n, .kpis .n { display: block; font: 750 1.5rem/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.mini-stats .l, .kpis .l { display: block; font-size: .75rem; color: var(--muted); margin-top: 2px; line-height: 1.25; }

/* ---------- sesión ---------- */
.s-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); padding: 6px 0; z-index: 5; }
.progress { flex: 1; height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.progress span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 42px; text-align: right; }
.s-meta { display: flex; gap: 8px; align-items: center; margin: 0 0 10px; font-size: .82rem; color: var(--muted); font-weight: 600; }
.new-tag { background: var(--accent-soft); color: var(--accent); padding: 2px 9px; border-radius: 99px; font-size: .75rem; }
.q-title { font: 700 1.55rem/1.25 var(--f-display); margin: 4px 0 6px; letter-spacing: -0.01em; }
.q { margin: 0 0 18px; color: var(--muted); font-weight: 550; }
.q.q-big { font: 650 1.2rem/1.4 var(--f-display); color: var(--ink); }
.hint { margin: -10px 0 14px; font-size: .85rem; color: var(--muted); }
.fig-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 10px; margin-bottom: 14px; display: flex; justify-content: center; }
.fig-wrap .fig { width: 100%; max-width: 260px; height: auto; max-height: 48vh; }
.fig-wrap.wide .fig { max-width: 520px; max-height: none; }
.fig-wrap.small .fig { max-width: 190px; }

.options { display: grid; gap: 10px; }
.opt {
  text-align: left; padding: 14px 16px; min-height: 54px; border-radius: var(--radius-m);
  background: var(--surface); border: 1.5px solid var(--line); font-weight: 550; line-height: 1.35;
  transition: border-color .15s ease, background .15s ease;
}
.opt:not(:disabled):active { border-color: var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-soft); color: var(--ink); }
.opt.bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.off { opacity: .55; }
.opt:disabled { cursor: default; }

.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 8px; margin-bottom: 18px; }
.chip {
  height: 56px; border-radius: var(--radius-m); border: 1.5px solid var(--line); background: var(--surface);
  font: 750 1.05rem/1 var(--f-display); font-variant-numeric: tabular-nums;
}
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.chip.ok.minor { background: var(--ok-soft); color: var(--ok); }
.chip.miss { border: 2px dashed var(--bad); color: var(--bad); }
.chip.minor-hint { border: 2px dashed var(--line); color: var(--muted); }
.chip.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.chip.off { opacity: .4; }

.feedback { margin-top: 18px; border-radius: var(--radius-l); padding: 16px 16px 16px; background: var(--surface); border: 1.5px solid var(--line); border-left-width: 6px; animation: rise .22s ease-out; }
.feedback.is-ok { border-left-color: var(--ok); }
.feedback.is-bad { border-left-color: var(--bad); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.verdict { font: 750 1.15rem/1.2 var(--f-display); margin: 0 0 6px; }
.is-ok .verdict { color: var(--ok); } .is-bad .verdict { color: var(--bad); }
.right-answer { margin: 0 0 10px; }
.ex { font-size: .95rem; }
.ex p { margin: 0 0 8px; }
.ex-title { font-weight: 700; margin-bottom: 4px !important; }
.profile { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 10px; font-size: .92rem; }
.profile dt { color: var(--muted); }
.profile dd { margin: 0; font-weight: 600; }
.again { font-size: .82rem; color: var(--muted); margin: 4px 0 0; }
.feedback .btn { margin-top: 14px; }

/* resumen */
.summary { text-align: center; padding-top: 12vh; }
.sum-title { font: 750 1.8rem/1.2 var(--f-display); margin: 0 0 20px; }
.sum-score .big { display: block; font: 800 4.2rem/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; }
.sum-score .big small { font-size: 1.8rem; color: var(--muted); }
.sum-score .lbl { color: var(--muted); }
.sum-line { margin: 22px 0 28px; }
.sum-actions { display: grid; gap: 10px; }
.sum-actions .btn.ghost { width: 100%; }

/* ---------- consulta ---------- */
.seg-ctrl { display: flex; background: var(--soft); padding: 4px; border-radius: 12px; gap: 4px; margin-bottom: 16px; }
.seg-ctrl button { flex: 1; border: 0; background: none; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: .9rem; color: var(--muted); }
.seg-ctrl button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 30, 50, .12); }
.search { width: 100%; padding: 13px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); }
.filters { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0 4px; padding-bottom: 4px; scrollbar-width: none; }
.pill { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 13px; white-space: nowrap; font-size: .85rem; font-weight: 600; }
.pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.count-line { color: var(--muted); font-size: .82rem; margin: 8px 0; }
.mlist, .clist, .blocks, .toggles { list-style: none; margin: 0; padding: 0; }
.mlist li, .clist li { border-bottom: 1px solid var(--line); }
.mlist summary, .clist summary { list-style: none; padding: 13px 2px; display: flex; justify-content: space-between; gap: 12px; cursor: pointer; }
.mlist summary::-webkit-details-marker, .clist summary::-webkit-details-marker { display: none; }
.mn { font-weight: 650; }
.mr { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .9rem; }
.mlist details[open] { padding-bottom: 12px; }
.mex { color: var(--muted); font-size: .9rem; margin: 0; }
.clist summary { font-size: .93rem; }
.ans { margin: 0 0 12px; font-weight: 650; color: var(--accent); }
.lvl, .fails { flex: none; font-size: .75rem; font-weight: 700; background: var(--soft); border-radius: 99px; padding: 1px 8px; height: fit-content; color: var(--muted); }
.fails { background: var(--bad-soft); color: var(--bad); }
.sel-label { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.sel-label select { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); }

.draw { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 16px; margin-bottom: 14px; }
.draw h3 { font: 650 1rem/1.3 var(--f-display); margin: 0 0 10px; }
.draw .fig-wrap { border: 0; padding: 0; margin: 0; }
.fig-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fig-pair .fig { width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; margin: 10px 0 0; color: var(--muted); }
.legend i { margin-left: 0; margin-right: 5px; }
.legend .z1 { background: var(--z1); } .legend .z2 { background: var(--z2); } .legend .z3 { background: var(--z3); } .legend .z4 { background: var(--z4); }
.legend .pl-lat-i { background: var(--z1); } .legend .pl-post-i { background: var(--z3); } .legend .pl-med-i { background: var(--z2); }
.ref { width: 100%; border-collapse: collapse; font-size: .92rem; }
.ref td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.ref td:last-child { font-weight: 650; color: var(--accent); text-align: right; }

/* ---------- progreso ---------- */
.card-sec { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-l); padding: 16px; margin-top: 14px; }
.kpis { margin-top: 0; }
.bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; padding-top: 14px; }
.bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; position: relative; }
.bar i { font-style: normal; font-size: .68rem; color: var(--muted); margin-top: 4px; }
.bar em { font-style: normal; font-size: .68rem; color: var(--muted); margin-bottom: 2px; font-variant-numeric: tabular-nums; }
.b-all { width: 100%; background: var(--accent-soft); border-radius: 4px 4px 2px 2px; display: flex; align-items: flex-end; min-height: 2px; }
.b-ok { width: 100%; background: var(--accent); border-radius: 4px 4px 2px 2px; }
.b-fc { width: 100%; background: var(--blue); border-radius: 4px 4px 2px 2px; min-height: 2px; opacity: .85; }
.blocks li { margin-bottom: 12px; }
.blocks li.off { opacity: .45; }
.b-top { display: flex; justify-content: space-between; font-size: .9rem; margin-bottom: 5px; font-weight: 600; }
.b-num { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 500; }
.meter { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--muted); border-radius: 99px; }
.meter .g { background: var(--ok); } .meter .y { background: var(--warn); } .meter .r { background: var(--bad); }

/* ---------- ajustes ---------- */
.stepper { display: flex; align-items: center; gap: 18px; }
.pd { font: 750 2rem/1 var(--f-display); min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
.toggles li { border-bottom: 1px solid var(--line); }
.toggles li:last-child { border: 0; }
.toggles label { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; cursor: pointer; gap: 12px; }
.toggles small { color: var(--muted); margin-left: 4px; }
.toggles input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggles input:checked + .sw { background: var(--accent); }
.toggles input:checked + .sw::after { transform: translateX(18px); }
.toggles input:focus-visible + .sw { outline: 3px solid var(--accent); outline-offset: 2px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.msg { font-size: .88rem; color: var(--accent); min-height: 1.2em; margin: 8px 0 0; }

/* ---------- dibujos ---------- */
.fig .sil-out path, .fig .sil-out ellipse { fill: none; stroke: var(--sil-line); stroke-width: 3; stroke-linejoin: round; }
.fig .sil path, .fig .sil ellipse { fill: var(--sil); }
.fig .seg path { stroke: var(--surface); stroke-width: .9; }
.fig .zone { fill: var(--accent) !important; }
.fig .z1 { fill: var(--z1) !important; } .fig .z2 { fill: var(--z2) !important; } .fig .z3 { fill: var(--z3) !important; } .fig .z4 { fill: var(--z4) !important; }
.fig .hide { fill: transparent !important; stroke: none !important; }
.fig rect.zone { opacity: .88; }
.fig .lm path, .fig .lm ellipse, .fig .lm rect, .fig .lm circle { fill: none; stroke: var(--muted); stroke-width: 1; opacity: .8; }
.fig .lm .lmdot { fill: var(--muted); }
.fig .kp { fill: var(--sil-line); }
.fig .kplabel { font: 700 8.5px var(--f-body); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 2.5px; }
.fig .kp-on { fill: var(--bad); stroke: #fff; stroke-width: 1.5; }
.fig .kp-halo { fill: var(--bad); opacity: .22; }
.fig .caption, .fig .side { font: 500 9px var(--f-body); fill: var(--muted); }
.fig .pl-a, .fig .pl-b, .fig .pl-c, .fig .pl-lat, .fig .pl-post, .fig .pl-med, .fig .pl-side { fill: none; stroke-width: 2.6; }
.fig .pl-lat { stroke: var(--z1); } .fig .pl-post { stroke: var(--z3); } .fig .pl-med { stroke: var(--z2); }
.fig .pl-a, .fig .pl-b, .fig .pl-c { stroke: var(--muted); }
.fig .pl-side { stroke: var(--muted); stroke-width: 1.2; stroke-dasharray: 3 2; }
.fig .pl-node { fill: var(--ink); }
.fig .pl-lab { font: 600 10.5px var(--f-body); fill: var(--ink); }
.fig .pl-br { font-weight: 700; }
.fig .pl-sub { fill: var(--muted); font-weight: 500; }
.fig .pl-small { font: 500 8.5px var(--f-body); fill: var(--muted); }
.fig .pl-col { font: 600 9px var(--f-body); fill: var(--muted); }

// Curva suave cerrada (Catmull-Rom -> Bézier)
function smoothClosed(pts) {
  const n = pts.length;
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  return d + 'Z';
}

// Extremidad a partir de una línea media con anchuras [[x,y,w],...]
function limb(points) {
  const L = [], R = [];
  for (let i = 0; i < points.length; i++) {
    const a = points[Math.max(0, i - 1)], b = points[Math.min(points.length - 1, i + 1)];
    let tx = b[0] - a[0], ty = b[1] - a[1];
    const len = Math.hypot(tx, ty) || 1; tx /= len; ty /= len;
    const nx = -ty, ny = tx, w = points[i][2] / 2;
    L.push([points[i][0] + nx * w, points[i][1] + ny * w]);
    R.push([points[i][0] - nx * w, points[i][1] - ny * w]);
  }
  // puntas redondeadas
  const first = points[0], last = points[points.length - 1];
  const tl = [points[points.length - 1][0] - points[points.length - 2][0], points[points.length - 1][1] - points[points.length - 2][1]];
  const tlen = Math.hypot(tl[0], tl[1]) || 1;
  const tip = [last[0] + tl[0] / tlen * last[2] * 0.35, last[1] + tl[1] / tlen * last[2] * 0.35];
  const tf = [points[1][0] - first[0], points[1][1] - first[1]];
  const flen = Math.hypot(tf[0], tf[1]) || 1;
  const base = [first[0] - tf[0] / flen * first[2] * 0.2, first[1] - tf[1] / flen * first[2] * 0.2];
  return smoothClosed([...L, tip, ...R.reverse(), base]);
}

const mirrorPts = (pts, W) => pts.map(p => [W - p[0], p[1], p[2]]);

  s += `<path d="M${x.r + 6},${R.C5 + 3} Q ${x.r + 14},${R.C6} ${x.r + 12},${R.C7}" class="pl-side"/><path d="M${x.r + 6},${R.C6 + 3} L${x.r + 12},${R.C7 - 6}" class="pl-side"/><path d="M${x.r + 12},${R.C7} Q ${x.r + 18},${R.T1 - 10} ${x.r + 16},${R.T1 + 16}" class="pl-side"/>`;
  s += `<text x="${x.r + 20}" y="${R.T1 + 24}" class="pl-small">torácico largo (C5-C7)</text>`;
  const node = (xx, yy, t, anchor = 'middle', dx = 0) => `<circle cx="${xx}" cy="${yy}" r="4" class="pl-node"/><text x="${xx + dx}" y="${yy - 8}" text-anchor="${anchor}" class="pl-lab">${t}</text>`;
  for (const [k, y] of Object.entries(R)) s += `<circle cx="${x.r}" cy="${y}" r="4" class="pl-node"/><text x="${x.r - 9}" y="${y + 4}" text-anchor="end" class="pl-lab">${k}</text>`;
  s += node(x.t, T.sup, 'superior') + node(x.t, T.med, 'medio') + node(x.t, T.inf, 'inferior');
  s += node(x.c, C.lat, 'lateral') + node(x.c, C.post, 'posterior') + node(x.c, C.med, 'medial');
  const br = (y, t) => `<circle cx="${x.b}" cy="${y}" r="4" class="pl-node"/><text x="${x.b + 8}" y="${y + 4}" class="pl-lab pl-br">${t}</text>`;
  s += br(B.mc, 'Musculocutáneo') + br(B.ax, 'Axilar') + br(B.rad, 'Radial') + br(B.medi, 'Mediano') + br(B.cub, 'Cubital');
  s += `<text x="${x.r}" y="262" text-anchor="middle" class="pl-col">Raíces</text><text x="${x.t}" y="262" text-anchor="middle" class="pl-col">Troncos</text><text x="${x.c}" y="262" text-anchor="middle" class="pl-col">Fascículos</text><text x="${x.b + 8}" y="262" class="pl-col">Nervios</text>`;
  return `<svg viewBox="0 0 400 272" class="fig fig-plexus" role="img" aria-label="Esquema del plexo braquial">${s}</svg>`;
}

// ---------- Plexo lumbosacro (barras de raíces) ----------
function svgLumbosacral() {
  const roots = ['T12', 'L1', 'L2', 'L3', 'L4', 'L5', 'S1', 'S2', 'S3', 'S4'];
  const nerves = [
    ['Iliohipogástrico / ilioinguinal', 'L1', 'L1'],
    ['Genitofemoral', 'L1', 'L2'],
    ['Femorocutáneo lateral', 'L2', 'L3'],
    ['Femoral', 'L2', 'L4'],
    ['Obturador', 'L2', 'L4'],
    ['Glúteo superior', 'L4', 'S1'],
    ['Glúteo inferior', 'L5', 'S2'],
    ['Ciático', 'L4', 'S3'],
    ['  Tibial', 'L4', 'S3'],
    ['  Peroneo común', 'L4', 'S2'],
    ['Cutáneo femoral posterior', 'S1', 'S3'],
    ['Pudendo', 'S2', 'S4'],
  ];
  const x0 = 188, cw = 20, top = 30, rh = 22;
  let s = roots.map((r, i) => `<text x="${x0 + i * cw + cw / 2}" y="20" text-anchor="middle" class="pl-lab">${r}</text>
    <line x1="${x0 + i * cw + cw / 2}" y1="26" x2="${x0 + i * cw + cw / 2}" y2="${top + nerves.length * rh}" class="grid"/>`).join('');
  nerves.forEach(([n, a, b], j) => {
    const y = top + j * rh + 10;
    const i1 = roots.indexOf(a), i2 = roots.indexOf(b);
    const sub = n.startsWith('  ');
    s += `<text x="${x0 - 8}" y="${y + 4}" text-anchor="end" class="pl-lab ${sub ? 'pl-sub' : ''}">${n.trim()}</text>
      <rect x="${x0 + i1 * cw + 3}" y="${y - 6}" width="${(i2 - i1 + 1) * cw - 6}" height="12" rx="6" class="${j < 5 ? 'bar-l' : 'bar-s'}"/>`;
  });
  return `<svg viewBox="0 0 400 ${top + nerves.length * rh + 12}" class="fig fig-ls" role="img" aria-label="Raíces de los nervios del plexo lumbosacro">${s}</svg>`;
}

// ---------- Dispatcher ----------
function renderFig(spec) {
  if (!spec) return '';
  switch (spec.kind) {
    case 'body': return svgBody(spec.view, spec);
    case 'hand': return svgHand(spec.view, spec);
    case 'leg': return svgLeg(spec);
    case 'bplex': return svgBrachialPlexus();
    case 'lsplex': return svgLumbosacral();
  }
  return '';
}

// ============================================================
//  Raíz y nervio — lógica de la app
// ============================================================
const APP_VERSION = '1.0.0';
const INTERVALS = [1, 3, 7, 14, 30, 60]; // días tras cada acierto consecutivo
const DAY_CUTOFF_H = 4; // el día cambia a las 4:00 (guardias)

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const pick = (a, n) => shuffle(a).slice(0, n);
const uniq = a => [...new Set(a)];
function todayKey(d = new Date()) {
  const t = new Date(d.getTime() - DAY_CUTOFF_H * 3600e3);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}
function addDays(key, n) {
  const [y, m, d] = key.split('-').map(Number);
  const t = new Date(y, m - 1, d + n, 12);
  return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
}
function daysBetween(a, b) {
  const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number);
  return Math.round((new Date(y2, m2 - 1, d2, 12) - new Date(y1, m1 - 1, d1, 12)) / 864e5);
}
const fmtRoots = (main, minor = []) => main.join(', ') + (minor.length ? ` (${minor.join(', ')})` : '');

// ---------- almacenamiento (IndexedDB con respaldo) ----------
const Store = {
  db: null,
  async open() {
    if (!('indexedDB' in window)) return;
    this.db = await new Promise((res) => {
      try {
        const r = indexedDB.open('raiz-nervio', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => res(null);
      } catch (e) { res(null); }
    });
  },
  async get(k) {
    if (this.db) {
      const v = await new Promise(res => {
        const tx = this.db.transaction('kv', 'readonly').objectStore('kv').get(k);
        tx.onsuccess = () => res(tx.result); tx.onerror = () => res(undefined);
      });
      if (v !== undefined) return v;
    }
    try { const s = localStorage.getItem('rn:' + k); return s ? JSON.parse(s) : undefined; } catch (e) { return undefined; }
  },
  async set(k, v) {
    if (this.db) {
      await new Promise(res => {
        const tx = this.db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = res;
      });
    }
    try { localStorage.setItem('rn:' + k, JSON.stringify(v)); } catch (e) { }
  },
};

// ---------- estado ----------
let S = null;
function defaultState() {
  return {
    v: 1, cards: {}, bank: 0, lastGrant: null, history: {},
    settings: { perDay: 10, theme: 'auto', blocks: Object.fromEntries(BLOCKS.map(b => [b.id, true])) },
  };
}
const save = () => Store.set('state', S);

// ---------- generación de tarjetas ----------
const RELATED = { ciatico: ['tibial', 'peroneo', 'obturador'], tibial: ['ciatico'], peroneo: ['ciatico'], obturador: ['ciatico'] };
const muscleById = Object.fromEntries(MUSCLES.map(m => [m.id, m]));

function muscleProfile(m) {
  return `<dl class="profile">
    <dt>Nervio</dt><dd>${esc(m.nerve)}</dd>
    ${m.roots.length ? `<dt>Raíces</dt><dd>${esc(fmtRoots(m.roots, m.minor))}</dd>` : ''}
    <dt>Función</dt><dd>${esc(m.act)}</dd></dl>`;
}

function buildCards() {
  const cards = [];
  const add = c => cards.push(c);
  const curated = (block, arr, extra = {}) => arr.forEach(([id, q, ok, ds, ex, tags]) => add({
    id, block, kind: 'mcq', q, tags: tags || [], answer: ok,
    make: () => ({ options: shuffle([ok, ...ds.split('|')]), correct: ok, ex: esc(ex) }), ...extra,
  }));

  // Músculos
  for (const m of MUSCLES) {
    const region = MUSCLES.filter(x => x.r === m.r);
    const tags = m.roots.slice();
    const exFull = `<p class="ex-title">${esc(m.n)}</p>${muscleProfile(m)}<p>${esc(m.ex)}</p>`;
    if (m.roots.length) add({
      id: m.id + ':raiz', block: m.r, kind: 'multi', title: m.n, q: '¿Qué raíces lo inervan?',
      hint: 'Marca las raíces principales. Las accesorias no restan.', chips: ROOT_CHIPS[m.r], main: m.roots, minor: m.minor,
      tags, answer: fmtRoots(m.roots, m.minor), make: () => ({ ex: exFull }),
    });
    add({
      id: m.id + ':nervio', block: m.r, kind: 'mcq', title: m.n, q: '¿Qué nervio lo inerva?', tags, answer: m.nerve,
      make: () => {
        const bad = [m.group, ...(RELATED[m.group] || [])];
        const pool = uniq(region.filter(x => !bad.includes(x.group) && x.nerve !== m.nerve).map(x => x.nerve));
        return { options: shuffle([m.nerve, ...pick(pool, 3)]), correct: m.nerve, ex: exFull };
      },
    });
    add({
      id: m.id + ':funcion', block: m.r, kind: 'mcq', title: m.n, q: '¿Cuál es su función principal?', tags, answer: m.act,
      make: () => {
        const pool = uniq(region.filter(x => x.fam !== m.fam && x.act !== m.act).map(x => x.act));
        return { options: shuffle([m.act, ...pick(pool, 3)]), correct: m.act, ex: exFull };
      },
    });
    if (m.inv) add({
      id: m.id + ':inv', block: m.r, kind: 'mcq', title: m.act, q: '¿Qué músculo se encarga principalmente de esto?', tags, answer: m.n,
      make: () => {
        const pool = uniq(region.filter(x => x.fam !== m.fam && x.act !== m.act).map(x => x.n));
        return { options: shuffle([m.n, ...pick(pool, 3)]), correct: m.n, ex: exFull };
      },
    });
  }
  // ¿Cuál NO inerva…?
  for (const [id, group, label, r] of NOT_NERVE) {
    const inG = MUSCLES.filter(m => m.group === group);
    const excl = new Set(['braquial', 'aductmayor']);
    const out = MUSCLES.filter(m => m.r === r && m.group !== group && !excl.has(m.id) && !(['tibial', 'peroneo'].includes(group) && m.group === 'ciatico'));
    add({
      id, block: r, kind: 'mcq', q: `¿Cuál de estos músculos NO está inervado por ${label}?`, tags: [],
      answer: `Inerva: ${inG.map(m => m.n).join(', ')}.`,
      make: () => {
        const odd = pick(out, 1)[0];
        const ins = pick(inG, 3);
        return {
          options: shuffle([odd.n, ...ins.map(m => m.n)]), correct: odd.n,
          ex: `<p><strong>${esc(odd.n)}</strong> depende del nervio ${esc(odd.nerve.toLowerCase())} (${esc(fmtRoots(odd.roots, odd.minor) || 'pares craneales')}).</p><p>Músculos de ${esc(label)} en la base: ${esc(inG.map(m => m.n).join(', '))}.</p>`,
        };
      },
    });
  }

  curated('refl', REFLEXES);

  // Miotomas
  const mioList = MYOTOMES.map(([l, mv]) => `${l}: ${mv.toLowerCase()}`).join('; ');
  const mioEx = `<p>Músculos clave ISNCSCI. ${esc(mioList)}.</p>`;
  MYOTOMES.forEach(([lvl, mov], i) => {
    add({
      id: 'mio_lvl_' + lvl, block: 'mio', kind: 'mcq', title: lvl, q: '¿Qué movimiento es su músculo clave en la ISNCSCI?', tags: [lvl], answer: mov,
      make: () => ({ options: shuffle([mov, ...pick(MYOTOMES.filter(x => x[0] !== lvl).map(x => x[1]), 3)]), correct: mov, ex: mioEx }),
    });
    add({
      id: 'mio_mov_' + lvl, block: 'mio', kind: 'mcq', title: mov, q: '¿Qué nivel explora en la ISNCSCI?', tags: [lvl], answer: lvl,
      make: () => {
        const lv = MYOTOMES.map(x => x[0]);
        const near = lv.filter((x, j) => j !== i && Math.abs(j - i) <= 3);
        return { options: shuffle([lvl, ...pick(near, 3)]), correct: lvl, ex: mioEx };
      },
    });
  });

  curated('plex', PLEXUS);

  // Dermatomas
  const dermOpts = lvl => {
    const i = DERM_LEVELS.indexOf(lvl);
    const near = DERM_LEVELS.filter((x, j) => j !== i && Math.abs(j - i) <= 3);
    return shuffle([lvl, ...pick(near, 3)]);
  };
  const figFor = (lvl, view) => view === 'hand' ? { kind: 'hand', view: 'dorsum', point: lvl }
    : view === 'leg' ? { kind: 'leg', point: lvl } : { kind: 'body', view, point: lvl };
  for (const [lvl, desc, view] of KEYPOINTS) {
    const ex = `<p><strong>${lvl}</strong>: ${esc(desc)}.</p><p>${esc(DERM_PEARLS[lvl] || '')}</p>`;
    add({
      id: 'dk_img_' + lvl, block: 'derm', kind: 'mcq', fig: figFor(lvl, view), q: '¿Qué dermatoma corresponde al punto marcado?', tags: [lvl], answer: lvl,
      make: () => ({ options: dermOpts(lvl), correct: lvl, ex }),
    });
    add({
      id: 'dk_desc_' + lvl, block: 'derm', kind: 'mcq', title: desc, q: '¿Qué dermatoma es este punto clave?', tags: [lvl], answer: lvl,
      make: () => ({ options: dermOpts(lvl), correct: lvl, ex }),
    });
  }
  for (const [id, lvl, kind, desc] of DERM_ZONES) {
    const fig = kind === 'hand' ? { kind: 'hand', view: 'dorsum', zone: lvl } : kind === 'leg' ? { kind: 'leg', zone: lvl } : { kind: 'body', view: 'front', band: lvl };
    add({
      id, block: 'derm', kind: 'mcq', fig, q: '¿Qué dermatoma corresponde a la zona resaltada?', tags: [lvl], answer: `${lvl}: ${desc}`,
      make: () => ({ options: dermOpts(lvl), correct: lvl, ex: `<p><strong>${lvl}</strong>: ${esc(desc.toLowerCase())}.</p><p>${esc(DERM_PEARLS[lvl] || '')} Los dermatomas se solapan y varían entre personas: las zonas son aproximadas.</p>` }),
    });
  }

  // Territorios cutáneos
  for (const [id, ok, figk, zone, ds, ex] of CUT_IMG) {
    const fig = figk === 'leg' ? { kind: 'leg', zone } : { kind: 'hand', view: figk, zone };
    add({
      id, block: 'cut', kind: 'mcq', fig, q: '¿Qué nervio da la sensibilidad de la zona resaltada?', tags: [], answer: ok,
      make: () => ({ options: shuffle([ok, ...ds.split('|')]), correct: ok, ex: esc(ex) }),
    });
  }
  curated('cut', CUT_DESC);
  curated('loc', LOCALIZATION);
  curated('emg', EMG.map(e => [...e, []]));
  return cards;
}

const CARDS = buildCards();
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));

// Orden de presentación de nuevas: reparto ponderado entre bloques
function curriculum() {
  const lists = {};
  for (const b of BLOCKS) lists[b.id] = [];
  // dentro de cada bloque, espaciar las tarjetas del mismo músculo
  for (const c of CARDS) lists[c.block].push(c.id);
  for (const b of ['ms', 'mi', 'ax']) {
    const ids = lists[b];
    const waves = { raiz: [], nervio: [], funcion: [], inv: [], other: [] };
    ids.forEach(id => { const t = id.split(':')[1]; (waves[t] || waves.other).push(id); });
    const out = [];
    const n = Math.max(...Object.values(waves).map(w => w.length));
    // intercala: nervio y raíz primero, función e inversas desplazadas
    for (let i = 0; i < n + 14; i++) {
      if (waves.nervio[i]) out.push(waves.nervio[i]);
      if (waves.raiz[i - 2]) out.push(waves.raiz[i - 2]);
      if (waves.funcion[i - 4]) out.push(waves.funcion[i - 4]);
      if (waves.inv[i - 6]) out.push(waves.inv[i - 6]);
      if (waves.other[i - 12]) out.push(waves.other[i - 12]);
    }
    lists[b] = uniq(out.concat(waves.inv, waves.other, ids));
  }
  // dermatomas: imagen y descripción del mismo nivel separadas
  {
    const img = lists.derm.filter(id => id.startsWith('dk_img')), desc = lists.derm.filter(id => id.startsWith('dk_desc')), zones = lists.derm.filter(id => id.startsWith('dz_'));
    const out = [];
    for (let i = 0; i < img.length + 14; i++) {
      if (img[i]) out.push(img[i]);
      if (i % 3 === 2 && zones[(i - 2) / 3]) out.push(zones[(i - 2) / 3]);
      if (desc[i - 12]) out.push(desc[i - 12]);
    }
    lists.derm = uniq(out.concat(lists.derm));
  }
  const res = [];
  const ptr = Object.fromEntries(BLOCKS.map(b => [b.id, 0]));
  let added = true;
  while (added) {
    added = false;
    for (const b of BLOCKS) {
      for (let k = 0; k < b.weight; k++) {
        if (ptr[b.id] < lists[b.id].length) { res.push(lists[b.id][ptr[b.id]++]); added = true; }
      }
    }
  }
  return res;
}
const CURRICULUM = curriculum();

// ---------- planificación ----------
const enabled = c => S.settings.blocks[c.block] !== false;
function unseenIds() { return CURRICULUM.filter(id => !S.cards[id] && enabled(CARD[id])); }
function dueIds(day = todayKey()) {
  return CARDS.filter(c => enabled(c) && S.cards[c.id] && S.cards[c.id].due <= day).map(c => c.id);
}
function grantDaily() {
  const t = todayKey();
  if (!S.lastGrant) { S.bank = S.settings.perDay; S.lastGrant = t; return; }
  const d = daysBetween(S.lastGrant, t);
  if (d > 0) { S.bank += S.settings.perDay * d; S.lastGrant = t; }
}
function pendingNew() { return Math.min(S.bank, unseenIds().length); }

function schedule(id, correct) {
  const t = todayKey();
  const st = S.cards[id] || { l: 0, r: 0, w: 0, first: t };
  const isNew = !S.cards[id];
  if (correct) { st.l = Math.min(st.l + 1, INTERVALS.length); st.due = addDays(t, INTERVALS[st.l - 1]); st.r++; }
  else { st.l = 0; st.due = addDays(t, 1); st.w++; }
  st.last = t;
  S.cards[id] = st;
  if (isNew) S.bank = Math.max(0, S.bank - 1);
  const h = S.history[t] || (S.history[t] = { n: 0, ok: 0 });
  h.n++; if (correct) h.ok++;
}

function streak() {
  let d = todayKey(), n = 0;
  if (!S.history[d]) d = addDays(d, -1);
  while (S.history[d] && S.history[d].n > 0) { n++; d = addDays(d, -1); }
  return n;
}

function rootStats() {
  const acc = {};
  for (const c of CARDS) {
    const st = S.cards[c.id];
    if (!st || !c.tags) continue;
    for (const t of c.tags) {
      const a = acc[t] || (acc[t] = { r: 0, w: 0, n: 0 });
      a.r += st.r; a.w += st.w; a.n++;
    }
  }
  return acc;
}

// ---------- sesión ----------
let session = null;
function startSession(extraNew = 0) {
  if (extraNew) { S.bank += extraNew; save(); }
  const due = shuffle(dueIds());
  const fresh = unseenIds().slice(0, pendingNew());
  // intercalar nuevas entre repasos
  const q = [];
  const step = fresh.length ? Math.max(1, Math.floor((due.length + fresh.length) / fresh.length)) : 1;
  let fi = 0, di = 0;
  while (di < due.length || fi < fresh.length) {
    for (let k = 0; k < step - 1 && di < due.length; k++) q.push(due[di++]);
    if (fi < fresh.length) q.push(fresh[fi++]); else if (di < due.length) q.push(due[di++]);
  }
  if (!q.length) return render();
  session = { queue: q, idx: 0, firstOk: 0, firstN: 0, seen: new Set(), retries: {}, total: q.length };
  showCard();
}

function showCard() {
  const id = session.queue[session.idx];
  const card = CARD[id];
  session.cur = { id, card, inst: card.make(), selected: new Set(), answered: false };
  render();
}

function answer(value) {
  const cur = session.cur;
  if (cur.answered) return;
  let ok;
  if (cur.card.kind === 'multi') {
    const sel = cur.selected, c = cur.card;
    ok = c.main.every(r => sel.has(r)) && [...sel].every(r => c.main.includes(r) || c.minor.includes(r));
  } else {
    cur.choice = value;
    ok = value === cur.inst.correct;
  }
  cur.answered = true; cur.ok = ok;
  const first = !session.seen.has(cur.id);
  session.seen.add(cur.id);
  if (first) {
    schedule(cur.id, ok);
    session.firstN++; if (ok) session.firstOk++;
    save();
  }
  if (!ok) {
    const n = session.retries[cur.id] = (session.retries[cur.id] || 0) + 1;
    if (n <= 2) { session.queue.push(cur.id); session.total++; }
  }
  render();
  requestAnimationFrame(() => { const f = $('.feedback'); if (f) f.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' }); });
}

function next() {
  session.idx++;
  if (session.idx >= session.queue.length) { session.done = true; render(); return; }
  showCard();
  window.scrollTo(0, 0);
}

// ---------- vistas ----------
let tab = 'hoy';
let consultaTab = 'musculos', consultaQ = '', consultaRegion = 'all', consultaBlock = 'ms', segSel = null;

function render() {
  applyTheme();
  const app = $('#app');
  if (session && !session.done) { app.innerHTML = viewSession(); bindSession(); return; }
  if (session && session.done) { app.innerHTML = viewSummary(); bindSummary(); return; }
  const views = { hoy: viewHome, consulta: viewConsulta, progreso: viewProgress, ajustes: viewSettings };
  app.innerHTML = `<main class="page">${views[tab]()}</main>${viewNav()}`;
  bindCommon();

function viewSegMap() {
  const st = rootStats();
  const rows = [
    ['Cervical', ['C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8']],
    ['Torácico', ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12']],
    ['Lumbar', ['L1', 'L2', 'L3', 'L4', 'L5']],
    ['Sacro', ['S1', 'S2', 'S3', 'S4-5']],
  ];
  const cls = a => {
    if (!a || a.r + a.w === 0) return 'u';
    const p = a.r / (a.r + a.w);
    return p >= 0.85 ? 'g' : p >= 0.6 ? 'y' : 'r';
  };
  let info = 'Toca un segmento para ver cómo lo llevas.';
  if (segSel) {
    const a = st[segSel];
    info = a && a.r + a.w ? `<strong>${segSel}</strong>: ${a.n} ${a.n === 1 ? 'tarjeta vista' : 'tarjetas vistas'}, ${Math.round(100 * a.r / (a.r + a.w))} % de aciertos.`
      : `<strong>${segSel}</strong>: aún no has visto tarjetas de este nivel.`;
  }
  return `<section class="segmap" aria-label="Mapa segmentario de aciertos">
    <h2 class="sec-title">Mapa segmentario</h2>
    ${rows.map(([name, lv]) => `<div class="seg-row"><span class="seg-name">${name}</span><div class="seg-cells ${name === 'Torácico' ? 'dense' : ''}">
      ${lv.map(l => `<button class="seg ${cls(st[l])} ${segSel === l ? 'sel' : ''}" data-seg="${l}" aria-label="${l}">${name === 'Torácico' ? l.slice(1) : l.replace('S4-5', 'S4')}</button>`).join('')}</div></div>`).join('')}
    <p class="seg-info">${info}</p>
    <p class="seg-legend"><i class="g"></i>≥85 %<i class="y"></i>60–84 %<i class="r"></i>&lt;60 %<i class="u"></i>sin datos</p>
  </section>`;
}

// ---- Sesión ----
function viewSession() {
  const { card, inst, answered, ok } = session.cur;
  const block = BLOCKS.find(b => b.id === card.block);
  const pct = Math.round(100 * session.idx / session.queue.length);
  const isNew = !session.seen.has(card.id) && !S.cards[card.id];
  let body = '';
  if (card.kind === 'multi') {
    const sel = session.cur.selected;
    body = `<div class="chips" role="group" aria-label="Raíces">${card.chips.map(r => {
      let c = sel.has(r) ? 'on' : '';
      if (answered) {
        const main = card.main.includes(r), minor = card.minor.includes(r), s = sel.has(r);
        c = main && s ? 'ok' : main ? 'miss' : minor && s ? 'ok minor' : minor ? 'minor-hint' : s ? 'bad' : 'off';
      }
      return `<button class="chip ${c}" data-chip="${r}" ${answered ? 'disabled' : ''} aria-pressed="${sel.has(r)}">${r}</button>`;
    }).join('')}</div>
    ${!answered ? `<button class="btn primary" id="check" ${sel.size ? '' : 'disabled'}>Comprobar</button>` : ''}`;
  } else {
    body = `<div class="options">${inst.options.map((o, i) => {
      let c = '';
      if (answered) c = o === inst.correct ? 'ok' : o === session.cur.choice ? 'bad' : 'off';
      return `<button class="opt ${c}" data-opt="${i}" ${answered ? 'disabled' : ''}>${esc(o)}</button>`;
    }).join('')}</div>`;
  }
  const fb = answered ? `<section class="feedback ${ok ? 'is-ok' : 'is-bad'}" aria-live="polite">
      <p class="verdict">${ok ? 'Correcto' : 'Incorrecto'}</p>
      ${!ok ? `<p class="right-answer">Respuesta: <strong>${esc(card.kind === 'multi' ? card.answer : inst.correct)}</strong></p>` : ''}
      <div class="ex">${inst.ex}</div>
      ${!ok ? `<p class="again">Volverá a salir al final de esta sesión y mañana.</p>` : ''}
      <button class="btn primary" id="next">${session.idx + 1 >= session.queue.length ? 'Terminar' : 'Siguiente'}</button>
    </section>` : '';
  return `<main class="page session">
    <header class="s-head">
      <button class="icon-btn" id="quit" aria-label="Salir de la sesión"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <span class="count">${session.idx + 1}/${session.queue.length}</span>
    </header>
    <p class="s-meta"><span class="blk">${esc(block.name)}</span>${isNew ? '<span class="new-tag">Nueva</span>' : ''}</p>
    ${card.fig ? `<div class="fig-wrap">${renderFig(card.fig)}</div>` : ''}
    ${card.title ? `<h2 class="q-title">${esc(card.title)}</h2>` : ''}
    <p class="q ${card.title ? '' : 'q-big'}">${esc(card.q)}</p>
    ${card.hint && !answered ? `<p class="hint">${esc(card.hint)}</p>` : ''}
    ${body}${fb}
  </main>`;
}

function bindSession() {
  $('#quit').onclick = () => { session = null; tab = 'hoy'; render(); };
  document.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(session.cur.inst.options[+b.dataset.opt]));
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    const s = session.cur.selected, r = b.dataset.chip;
    s.has(r) ? s.delete(r) : s.add(r);
    b.classList.toggle('on'); b.setAttribute('aria-pressed', s.has(r));
    $('#check').disabled = !s.size;
  });
  const ck = $('#check'); if (ck) ck.onclick = () => answer();
  const nx = $('#next'); if (nx) { nx.onclick = next; nx.focus({ preventScroll: true }); }
}

    const list = MUSCLES.filter(m => (consultaRegion === 'all' || m.r === consultaRegion) &&

      <ul class="mlist">${list.map(m => `<li><details><summary><span class="mn">${esc(m.n)}</span>
        <span class="mr">${m.roots.length ? esc(fmtRoots(m.roots, m.minor)) : esc(m.nerve.match(/\(([^)]+)\)/)?.[1] || '')}</span></summary>
        ${muscleProfile(m)}<p class="mex">${esc(m.ex)}</p></details></li>`).join('')}</ul>`;

    body = `<label class="sel-label">Bloque <select id="cblock">${BLOCKS.map(x => `<option value="${x.id}" ${x.id === consultaBlock ? 'selected' : ''}>${x.name}</option>`).join('')}</select></label>

// ---- Progreso ----
function viewProgress() {
  const t = todayKey();
  const days = [...Array(14)].map((_, i) => addDays(t, i - 13));
  const maxN = Math.max(10, ...days.map(d => (S.history[d] || {}).n || 0));
  const fc = [...Array(7)].map((_, i) => {
    const d = addDays(t, i + 1);
    return [d, CARDS.filter(c => enabled(c) && S.cards[c.id] && S.cards[c.id].due === d).length];
  });
  const maxF = Math.max(5, ...fc.map(x => x[1]));
  const wd = d => new Date(d + 'T12:00').toLocaleDateString('es-ES', { weekday: 'narrow' });
  let R = 0, W = 0;
  Object.values(S.cards).forEach(s => { R += s.r; W += s.w; });
  const failed = Object.entries(S.cards).filter(([id, s]) => s.w > 0 && CARD[id]).sort((a, b) => b[1].w - a[1].w || a[1].l - b[1].l).slice(0, 12);
  return `<h1 class="page-title">Progreso</h1>
  <section class="kpis">
    <div><span class="n">${streak()}</span><span class="l">racha (días)</span></div>
    <div><span class="n">${Object.keys(S.cards).length}</span><span class="l">tarjetas vistas</span></div>
    <div><span class="n">${R + W ? Math.round(100 * R / (R + W)) : 0} %</span><span class="l">aciertos totales</span></div>
  </section>
  <section class="card-sec"><h2 class="sec-title">Últimos 14 días</h2>
    <div class="bars">${days.map(d => { const h = S.history[d] || { n: 0, ok: 0 }; return `<div class="bar" title="${d}: ${h.n} respondidas"><span class="b-all" style="height:${100 * h.n / maxN}%"><span class="b-ok" style="height:${h.n ? 100 * h.ok / h.n : 0}%"></span></span><i>${wd(d)}</i></div>`; }).join('')}</div>
    <p class="note">Altura: tarjetas respondidas. Parte oscura: acertadas a la primera.</p></section>
  <section class="card-sec"><h2 class="sec-title">Repasos de los próximos 7 días</h2>
    <div class="bars">${fc.map(([d, n]) => `<div class="bar" title="${d}: ${n}"><em>${n || ''}</em><span class="b-fc" style="height:${85 * n / maxF}%"></span><i>${wd(d)}</i></div>`).join('')}</div></section>
  <section class="card-sec"><h2 class="sec-title">Por bloque</h2>
    <ul class="blocks">${BLOCKS.map(b => {
      const cs = CARDS.filter(c => c.block === b.id);
      const seen = cs.filter(c => S.cards[c.id]);
      let r = 0, w = 0; seen.forEach(c => { r += S.cards[c.id].r; w += S.cards[c.id].w; });
      const p = r + w ? Math.round(100 * r / (r + w)) : null;
      return `<li class="${S.settings.blocks[b.id] === false ? 'off' : ''}"><div class="b-top"><span>${b.name}</span><span class="b-num">${seen.length}/${cs.length}${p !== null ? `, ${p} %` : ''}</span></div>
        <div class="meter"><span style="width:${100 * seen.length / cs.length}%" class="${p === null ? '' : p >= 85 ? 'g' : p >= 60 ? 'y' : 'r'}"></span></div></li>`;
    }).join('')}</ul></section>
  <section class="card-sec"><h2 class="sec-title">Las que más fallas</h2>
    ${failed.length ? `<ul class="clist">${failed.map(([id, s]) => { const c = CARD[id]; return `<li><details><summary>${esc(c.title ? `${c.title}: ${c.q}` : c.q)}<span class="fails">${s.w}×</span></summary>${c.fig ? `<div class="fig-wrap small">${renderFig(c.fig)}</div>` : ''}<p class="ans">${esc(c.answer)}</p></details></li>`; }).join('')}</ul>`
      : '<p class="note">Aquí aparecerán las tarjetas que falles, para repasarlas de un vistazo.</p>'}</section>`;
}

}

function bindCommon() {
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); window.scrollTo(0, 0); });
  const st = $('#start'); if (st) st.onclick = () => startSession();
  const mo = $('#more'); if (mo) mo.onclick = () => startSession(10);
  document.querySelectorAll('[data-seg]').forEach(b => b.onclick = () => { segSel = segSel === b.dataset.seg ? null : b.dataset.seg; render(); });
  // consulta
  document.querySelectorAll('[data-ctab]').forEach(b => b.onclick = () => { consultaTab = b.dataset.ctab; render(); });
  document.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => { consultaRegion = b.dataset.reg; render(); });
  const cq = $('#cq');
  if (cq) cq.oninput = () => {
    consultaQ = cq.value; const pos = cq.selectionStart; render();
    const n = $('#cq'); n.focus(); n.setSelectionRange(pos, pos);
  };
  const cb = $('#cblock'); if (cb) cb.onchange = () => { consultaBlock = cb.value; render(); };
  // ajustes
  const pdm = $('#pd-'), pdp = $('#pd\\+');
  if (pdm) pdm.onclick = () => { S.settings.perDay = Math.max(1, S.settings.perDay - 1); save(); render(); };
  if (pdp) pdp.onclick = () => { S.settings.perDay = Math.min(50, S.settings.perDay + 1); save(); render(); };
  document.querySelectorAll('[data-blk]').forEach(i => i.onchange = () => { S.settings.blocks[i.dataset.blk] = i.checked; save(); });
  document.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => { S.settings.theme = b.dataset.themeSet; save(); render(); });
  const ex = $('#exp');
  if (ex) ex.onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'raiz-nervio', exported: new Date().toISOString(), state: S }, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `raiz-nervio-${todayKey()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    $('#msg').textContent = 'Copia exportada.';
  };
  const im = $('#imp');
  if (im) im.onchange = async () => {
    const f = im.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const st = data.state || data;
      if (!st.cards || !st.settings) throw new Error();
      if (!confirm('Se sustituirá el progreso actual por el de la copia. ¿Continuar?')) return;
      S = Object.assign(defaultState(), st);
      S.settings = Object.assign(defaultState().settings, st.settings);
      await save(); render(); $('#msg').textContent = 'Progreso importado.';
    } catch (e) { $('#msg').textContent = 'El archivo no es una copia válida de Raíz y nervio.'; }
  };
  const rs = $('#reset');
  if (rs) rs.onclick = async () => {
    if (!confirm('Se borrará todo tu progreso. Esta acción no se puede deshacer. ¿Continuar?')) return;
    const theme = S.settings.theme;
    S = defaultState(); S.settings.theme = theme; grantDaily(); await save(); render();
  };
}

function applyTheme() {
  const t = S.settings.theme;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.content = dark ? '#101827' : '#F1F4F7';
}

// ---------- arranque ----------
(async function init() {
  await Store.open();
  const loaded = await Store.get('state');
  S = Object.assign(defaultState(), loaded || {});
  S.settings = Object.assign(defaultState().settings, (loaded || {}).settings || {});
  S.settings.blocks = Object.assign(defaultState().settings.blocks, S.settings.blocks || {});
  grantDaily();
  await save();
  render();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => render());
  // al volver a la app otro día, recalcular
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !session) { grantDaily(); save(); render(); }
  });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js').catch(() => { });
  }
})();

</script>
